[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-signals"
version = "0.2.1"
description = "Finds companies by their public repository activity and drafts evidence-grounded emails for a human to send."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "honeycombagents.ai" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
repo-signals = "repo_signals.cli:main"

[project.urls]
Homepage = "https://honeycombagents.ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repo_signals.drafting" = ["templates/*.txt"]
